<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio CSS Grid</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 150px);
            gap: 10px;
            border: 2px solid #333;
            padding: 10px;
            /* Alineación general de ítems (puedes modificar) */
            justify-items: center;
            align-items: center;
        }

        .card {
            background-color: #4CAF50;
            color: white;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        /* Posicionamiento inicial de tarjetas (modifica en el ejercicio) */
        #card1 {
            grid-column: 2/4;
            grid-row: 2;
        }

        #card2 {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }

        #card3 {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        #card4 {
            grid-column: 4 / 5;
            grid-row: 1 / 2;
        }

        #card5 {
            grid-column: 1;
            grid-row: 3;
        }

        #card6 {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }

        #card7 {
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }

        #card8 {
            grid-column: 4 / 5;
            grid-row: 2 / 3;
        }

        #card9 {
            grid-column: 1 / 2;
            grid-row: 3 / 4;
        }

        #card10 {
            grid-column: 2 / 3;
            grid-row: 3 / 4;
        }

        #card11 {
            grid-column: 3 / 4;
            grid-row: 3 / 4;
        }

        #card12 {
            grid-column: 3;
            grid-row: 1;
        }
    </style>
</head>

<body>
    <h1>Ejercicio CSS Grid: Posicionamiento y Alineación</h1>
    <p>Modifica el CSS para mover las tarjetas y centrar su contenido.</p>

    <div class="grid-container">
        <div class="card" id="card1">Tarjeta 1</div>
        <div class="card" id="card2">Tarjeta 2</div>
        <div class="card" id="card3">Tarjeta 3</div>
        <div class="card" id="card4">Tarjeta 4</div>
        <div class="card" id="card5">Tarjeta 5</div>
        <div class="card" id="card6">Tarjeta 6</div>
        <div class="card" id="card7">Tarjeta 7</div>
        <div class="card" id="card8">Tarjeta 8</div>
        <div class="card" id="card9">Tarjeta 9</div>
        <div class="card" id="card10">Tarjeta 10</div>
        <div class="card" id="card11">Tarjeta 11</div>
        <div class="card" id="card12">Tarjeta 12</div>
    </div>
</body>

</html>
