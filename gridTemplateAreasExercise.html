<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout con grid-template-areas</title>

    <style>
        .container {
            display: grid;
           /* grid-template-columns: repeat(3, 1fr);
            grid-template-rows: auto 1fr auto;
            /* Completa aquí grid-template-areas */
            grid-template-areas: repeat(auto-fill(2,1fr));
            grid-gap: 10px;
            height: 300px;
            border: 2px solid #333;

        }

        header {
            /* Asigna el área header */
            background-color: #8ecae6;
            padding: 10px;
            color: #023047;
            font-weight: bold;
            text-align: center;
        }

        main {
            /* Asigna el área content */
            background-color: #219ebc;
            padding: 10px;
            color: white;
        }

        aside {
            /* Asigna el área sidebar */
            background-color: #ffb703;
            padding: 10px;
            color: #fb8500;
        }

        footer {
            /* Asigna el área footer */
            background-color: #023047;
            padding: 10px;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>Header</header>
        <main>Content</main>
        <aside>Sidebar</aside>
        <footer>Footer</footer>
    </div>
</body>

</html>
